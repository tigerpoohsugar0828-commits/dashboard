<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>週次レポート（水曜更新）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1f29;--muted:#6c707b;--line:#e3e6eb;--navy:#223049}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#fff;font-family:'Noto Sans JP','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;letter-spacing:.01em}
a{color:var(--navy)}a:hover{color:#3f6aa8}
.tool{position:sticky;top:0;z-index:10;background:#f7f7f5;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
.btn{border:none;border-radius:6px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.p{background:var(--navy);color:#fff}.btn.s{background:#fff;color:var(--navy);border:1px solid #c9ccd3}
.tool .hint{font-size:12px;color:var(--muted);flex-basis:100%}
.page{max-width:900px;margin:0 auto;padding:40px 48px 120px}
h1{font-size:30px;font-weight:900;margin:0 0 18px;letter-spacing:-.01em}
.props{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.props dt{color:var(--muted)}.props dd{margin:0}
.chip{display:inline-block;background:#e3e2e0;border-radius:4px;padding:0 7px;font-size:13px;white-space:nowrap}
h2{font-size:22px;font-weight:800;margin:40px 0 10px;padding-left:11px;border-left:4px solid var(--navy)}
h3{font-size:17px;font-weight:800;margin:26px 0 6px}
p{margin:3px 0}
.arrow{font-weight:700}
.note{color:var(--muted);font-size:14px}
.img{margin:10px 0 6px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.img iframe{width:100%;border:0;display:block;height:200px}
.cp{display:none}
.cp:hover{color:var(--navy)}
table{border-collapse:collapse;font-size:13px;margin:8px 0 14px}
th,td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left}
th{font-size:11px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
td.n{text-align:right;font-feature-settings:'tnum' 1}
table{width:100%}td,th{word-break:keep-all}td.n,th.n{white-space:nowrap}
.box{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0;background:#fafbfc}.box p{margin:3px 0}
.callout{background:#f7f6f3;border-radius:6px;padding:12px 16px;margin:10px 0;display:flex;gap:10px}
textarea{width:100%;min-height:70px;border:1px dashed #cfd3da;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;line-height:1.7;resize:vertical;color:var(--ink)}
textarea:focus{outline:none;border-style:solid;border-color:#9aa0ab}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;display:none;z-index:20}
@media print{.tool,.cp,#toast{display:none!important}.page{padding:0}textarea{border:none;padding:0;min-height:0}h2{break-before:auto}}
</style>
<script>
(function(){const PASS='report2026',K='report_auth_v1';
 if(localStorage.getItem(K)===PASS||localStorage.getItem('starter_dash_admin_v1')==='1')return;
 document.documentElement.style.visibility='hidden';
 addEventListener('DOMContentLoaded',()=>{const v=prompt('レポートを見るにはパスワードを入力してください');
  if(v===PASS){localStorage.setItem(K,PASS);document.documentElement.style.visibility='';}
  else{document.body.innerHTML='<p style="padding:60px;text-align:center;font-family:sans-serif;color:#6c707b;">パスワードが違います。ページを再読み込みしてください。</p>';document.documentElement.style.visibility='';}});})();
</script>
</head>
<body>
<div class="tool">
  <strong style="font-size:14px;">週次レポート（水曜更新）</strong>
  <select id="date" onchange="go()"></select>
  <button class="btn p" onclick="exportZip()">Notion用に書き出し（画像込み）</button>
  <button class="btn s" onclick="copyText()">文章だけコピー</button>
  <button class="btn s" onclick="window.print()">PDFで出力</button>
  <div class="hint">「Notion用に書き出し」で保存されたZIPを、Notionの「インポート → テキストとMarkdown」で取り込むと、このページが画像込みでそのまま作られます。KPIダッシュボードを開くたびにその日の画面が記録されます（同じブラウザで開いてください）。</div>
</div>
<div class="page" id="page"></div>
<div id="toast"></div>
<script>
const LS='weekly_report_data_v1', NOTE='weekly_report_note_wed_v1';
// 水曜更新版：水曜日の記録だけを使い、先週＝1週間前の水曜の記録と比べる（中身は金曜版と同じ）
const WD=3;
const isWD=k=>new Date(k+'T12:00:00').getDay()===WD;
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}};
const pc=(a,b)=>b?+(a/b*100).toFixed(1):0;
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mo=ym=>+ym.split('/')[1];
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const PHASE_POSTS={phase2:22,phase3:31,phase4:38,grad:43};
let CUR=null,PREV=null,KEY=null,SHOTS=null,PSHOTS=null,IMGS=[];
function note(id){const a=load(NOTE);return ((a[KEY]||{})[id])||''}
function setNote(id,v){const a=load(NOTE);a[KEY]=a[KEY]||{};a[KEY][id]=v;localStorage.setItem(NOTE,JSON.stringify(a))}
function _idb(){return new Promise((res,rej)=>{const q=indexedDB.open('weekly_report_v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('shots');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function loadShots(key){try{const db=await _idb();return await new Promise(r=>{const q=db.transaction('shots').objectStore('shots').get(key);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});}catch(e){return null;}}
// ── ダッシュボードの画面をそのまま表示 ──
function shot(h,name){
  if(!h)return `<p class="note">（この画面は記録されていません。KPIダッシュボードを開いてから再読み込みしてください）</p>`;
  const i=IMGS.push({name,html:h})-1;
  return `<div class="img"><iframe id="f${i}" title="${esc(name)}"></iframe></div><button class="cp" onclick="copyImg(${i})">↑ 画像としてコピー</button>`;
}
function frameDoc(h){return `<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet"><style>${(SHOTS&&SHOTS.css)||''}</style><style>html,body{margin:0;padding:0;background:#fff!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body{padding:6px!important}[onclick]{pointer-events:none}#app-sidebar{display:none}.grad-top-grid{grid-template-columns:1fr!important}.grad-top-grid>*:not(:first-child){display:none!important}[data-wr="attr"]{display:none!important}</style></head><body>${h}</body></html>`}
function fit(f){try{const d=f.contentDocument;f.style.height=(Math.max(d.body.scrollHeight,d.documentElement.scrollHeight)+6)+'px'}catch(e){}}
function mount(){IMGS.forEach((x,i)=>{const f=document.getElementById('f'+i);if(!f)return;f.onload=()=>{fit(f);setTimeout(()=>fit(f),700);setTimeout(()=>fit(f),1800)};f.srcdoc=frameDoc(x.html)})}
function _h2c(){return window.html2canvas?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function toPng(i){await _h2c();const f=document.getElementById('f'+i);const c=await html2canvas(f.contentDocument.body,{backgroundColor:'#ffffff',scale:2,logging:false});return await new Promise(r=>c.toBlob(r,'image/png'))}
async function copyImg(i){try{const b=await toPng(i);await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('画像をコピーしました')}catch(e){toast('コピーできませんでした')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
// ── 分析文（良かった点／良くない点）──
function stages(c){return [['fp','初投稿','全員（対象者）'],['r100','100人','初投稿'],['r1','1,000人','100人'],['r3','3,000人','1,000人'],['r5','5,000人','3,000人'],['mk','万垢','5,000人']]}
const BK={fp:'初投稿完了日',r100:'100フォロワー達成日',r1:'1000フォロワー達成日',r3:'3000フォロワー達成日',r5:'5000フォロワー達成日',mk:'万垢達成'};
// ── ① KGI・KPIの進捗 ──
function progressTbl(c){
  const tg=c.targets,N=c.n;const R=[];
  const row=(lb,k,t,isK)=>{if(t==null)return;const cur=c.cur[k],prv=c.prev?c.prev[k]:null,p=pc(cur,N),need=Math.max(0,Math.ceil(N*t/100)-cur),ok=p>=t,d=prv!=null?cur-prv:null;
    R.push(`<tr><td>${isK?'<strong>KGI</strong> ':'KPI '}${lb}</td><td class="n">${t}%</td><td class="n"><strong>${p}%</strong>（${cur}/${N}名）</td><td class="n">${d==null?'—':`<strong style="color:${d>0?'#c0453f':'#6c707b'};">${d>0?'+':''}${d}名</strong>`}</td><td class="n"><strong style="color:${ok?'#c0453f':'#3f6aa8'};">${ok?'達成':'未達'}</strong></td><td class="n">${ok?'—':`あと<strong>${need}</strong>名`}</td></tr>`);};
  const isGrad=c.phase==='grad';
  row(isGrad?'万垢率':'万垢率（今月の目標）','mk',tg.mk,isGrad);
  if(!isGrad&&c.finalKgi!=null&&c.finalKgi!==tg.mk)row('万垢率（卒業時の最終目標）','mk',c.finalKgi,true);
  row('5,000人以上率','r5',tg.r5);row('3,000人以上率','r3',tg.r3);row('1,000人以上率','r1',tg.r1);
  return `<table><thead><tr><th>指標</th><th class="n">目標</th><th class="n">現在</th><th class="n">先週比</th><th class="n">判定</th><th class="n">達成まで</th></tr></thead><tbody>${R.join('')}</tbody></table>`;
}
// ── ② なぜ達成していないか（フォロワー・投稿数のファネル）──
function diagHtml(c,S,m){
  const bench=CUR.bench||{};const L=[['fp','初投稿','全員（対象者）'],['r100','100人','初投稿'],['r1','1,000人','100人'],['r3','3,000人','1,000人'],['r5','5,000人','3,000人'],['mk','万垢','5,000人']];
  let prev=c.n;const rows=L.map(([k,lb,pl])=>{const v=prev?+(c.cur[k]/prev*100).toFixed(1):null;const b=bench[BK[k]];const ref=b?(k==='fp'?b.abs:b.rel):null;const g=v!=null&&ref!=null?+(v-ref).toFixed(1):null;const o={k,lb,pl,v,ref,g,n:c.cur[k],from:prev};prev=c.cur[k];return o;});
  const worst=rows.filter(x=>x.g!=null&&x.g<0).sort((a,b)=>a.g-b.g).slice(0,2);const wk=new Set(worst.map(x=>x.k));
  const tb=`<table><thead><tr><th>段階</th><th class="n">到達</th><th class="n">通過率</th><th class="n">目安</th><th class="n">差</th></tr></thead><tbody>${rows.map(x=>`<tr${wk.has(x.k)?' style="background:#eef3fb;"':''}><td>${wk.has(x.k)?'<strong style="color:#3f6aa8;">▼ ':''}${x.pl}→${x.lb}${wk.has(x.k)?'</strong>':''}</td><td class="n">${x.n}名</td><td class="n"><strong>${x.v??'—'}%</strong></td><td class="n">${x.ref??'—'}%</td><td class="n">${x.g==null?'—':`<strong style="color:${x.g>=0?'#c0453f':'#3f6aa8'};">${x.g>0?'+':''}${x.g}pt</strong>`}</td></tr>`).join('')}</tbody></table>`;
  // 投稿数：この時期の万垢達成者の中央値と比べる
  const MK={phase2:16,phase3:25,phase4:34,grad:42}[c.phase];const lag=MK!=null&&c.postMed!=null?MK-c.postMed:null;
  const F=c.fwAtPost||{};const fw=[10,20,30].filter(N=>F[N]&&F[N].n>=5&&F[N].past).map(N=>({N,r:Math.round(F[N].cur/F[N].past*100)}));
  const growBad=fw.length&&fw.filter(x=>x.r<85).length>=Math.ceil(fw.length/2),postBad=lag!=null&&lag>=5;
  const ptb=`<table><thead><tr><th>投稿の見方</th><th class="n">この月</th><th class="n">比べる値</th><th class="n">判定</th></tr></thead><tbody>
    <tr><td>投稿数の中央値</td><td class="n"><strong>${c.postMed??'—'}投稿</strong></td><td class="n">万垢達成者の同時期 ${MK??'—'}投稿</td><td class="n">${lag==null?'—':`<strong style="color:${postBad?'#3f6aa8':'#c0453f'};">${postBad?lag+'投稿不足':'足りている'}</strong>`}</td></tr>
    ${fw.map(x=>`<tr><td>${x.N}投稿目時点のフォロワー</td><td class="n"><strong>${F[x.N].cur.toLocaleString()}人</strong></td><td class="n">過去の全員 ${F[x.N].past.toLocaleString()}人</td><td class="n"><strong style="color:${x.r>=100?'#c0453f':(x.r<85?'#3f6aa8':'inherit')};">${x.r}%</strong></td></tr>`).join('')}</tbody></table>`;
  const v=postBad&&growBad?'投稿の量も、投稿あたりの伸びも足りていない':(postBad?'投稿の量が足りていない（同じ投稿数での伸びは過去並み）':(growBad?'投稿あたりの伸びが足りていない（投稿の量は足りている）':'投稿の量・伸びとも過去並み'));
  const all=progressOk(c);
  // 止まっている段階で、どの属性の生徒が止まっているか
  const stuckHtml=worst.map(w=>stuckAttr(c,w)).join('');
  return `<h3>② ${all?'目標の進み具合':'なぜ達成していないか'}</h3>
    <div class="box"><p><strong>フォロワーで止まっている段階：</strong>${worst.length?worst.map(x=>`<strong style="color:#3f6aa8;">${x.pl}→${x.lb}</strong>（通過率${x.v}%／目安${x.ref}%）`).join('、'):'目安を下回る段階なし'}</p>
    <p><strong>投稿から見た原因：</strong><strong style="color:#3f6aa8;">${v}</strong></p></div>
    <p><strong>フォロワーファネル</strong></p>${tb}${shot(noExtra(S.funnel),m+'月卒業生_フォロワーファネル')}${stuckHtml}
    <p><strong>投稿数ファネル</strong></p>${ptb}${shot(noExtra(S.funnelPost),m+'月卒業生_投稿数ファネル')}${postAttr(c,MK)}`;
}
function progressOk(c){const tg=c.targets;return ['mk','r5','r3','r1'].every(k=>tg[k]==null||pc(c.cur[k],c.n)>=tg[k]);}
// ファネルの画像から、万垢率・投稿頻度・投稿数ベースの到達率などの付録を外す
function noExtra(h){if(!h||h.indexOf('funnelExtra')<0)return h;const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('[data-wr="funnelExtra"]').forEach(e=>e.remove());const d=document.createElement('div');d.appendChild(t.content);return d.innerHTML;}
// 投稿数が少ない属性：この時期の目安（万垢達成者の同時期の投稿数）に届いている割合を属性ごとに比べる
function postAttr(c,MK){
  const T=c.tiers;if(!T)return '';const th=MK||10;
  const rows=Object.values(T).flat().filter(r=>r[3]!=null);const N=rows.length;if(N<20)return '';
  const ok=r=>r[3]>=th,K=rows.filter(ok).length;
  const nf=z=>{const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const pr=1-d*t*(1.330274*t**4-1.821256*t**3+1.781478*t*t-0.356538*t+0.319381);return z>0?pr:1-pr;};
  const med=a=>{const s=a.slice().sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:null;};
  const F={'年代':r=>r[12],'職業':r=>r[13],'コース':r=>r[5],'ジャンル':r=>r[6]};const out=[];
  Object.entries(F).forEach(([lb,f])=>{const g={};rows.forEach(r=>{const v=f(r);if(!v||/^（|その他|未設定/.test(v))return;(g[v]=g[v]||[]).push(r);});
    Object.entries(g).forEach(([v,L])=>{if(L.length<8)return;const n2=N-L.length;if(n2<8)return;const k1=L.filter(ok).length,k2=K-k1,p1=k1/L.length,p2=k2/n2,pp=K/N,se=Math.sqrt(pp*(1-pp)*(1/L.length+1/n2));const p=se?+(2*(1-nf(Math.abs((p1-p2)/se)))).toFixed(4):1;
      out.push({lb,v,n:L.length,med:med(L.map(r=>r[3])),rate:+(p1*100).toFixed(1),other:+(p2*100).toFixed(1),diff:+((p1-p2)*100).toFixed(1),p});});});
  const low=out.filter(x=>x.diff<0).sort((a,b)=>a.p-b.p||a.diff-b.diff);const sig=low.filter(x=>x.p<0.1),show=(sig.length?sig:low).slice(0,6);if(!show.length)return '';
  const base=+(K/N*100).toFixed(1);const pf=p=>p<0.1?`<strong>★${p<0.001?'&lt;0.001':p}</strong>`:String(p);
  const sum=sig.length?`投稿数が少ないのは${sig.slice(0,3).map(x=>`<strong>${esc(x.lb)}「${esc(x.v)}」</strong>（目安達成${x.rate}%・中央値${x.med}投稿）`).join('、')}。全体（${base}%）より有意に低い。`:`全体（${base}%）より有意に投稿数が少ない属性はない。下は差の大きい順の参考。`;
  return `<p style="margin-top:14px;"><strong>▼ 投稿数が少ない属性</strong>（この時期の目安${th}投稿以上の人＝全体${base}%）</p><div class="box"><p>${sum}</p></div>
    <table><thead><tr><th>属性</th><th>区分</th><th class="n">対象</th><th class="n">投稿数の中央値</th><th class="n">目安以上の割合</th><th class="n">その他の生徒</th><th class="n">差</th><th class="n">p値</th></tr></thead><tbody>${show.map(x=>`<tr><td>${x.lb}</td><td><strong>${esc(x.v)}</strong></td><td class="n">${x.n}名</td><td class="n">${x.med}投稿</td><td class="n"><strong style="color:#3f6aa8;">${x.rate}%</strong></td><td class="n">${x.other}%</td><td class="n"><strong style="color:#3f6aa8;">${x.diff}pt</strong></td><td class="n">${pf(x.p)}</td></tr>`).join('')}</tbody></table>
    <p class="note">目安＝万垢達成者の同時期の投稿数（中央値）。8名以上の区分のみ／★＝p&lt;0.1。</p>`;
}
// 止まっている段階ごとに、属性別の「止まりやすさ」を比べる（前の段階に届いた人のうち、次に進めていない割合）
function stuckAttr(c,w){
  const T=c.tiers;if(!T)return '';
  const ORD=['none','low','r100','r1','r3','r5','mk'];const STG={fp:0,r100:1,r1:2,r3:3,r5:4,mk:5};const idx=STG[w.k];if(idx==null)return '';
  const rows=[];ORD.forEach((k,i)=>(T[k]||[]).forEach(r=>rows.push({i,r})));
  const reached=rows.filter(x=>x.i>=idx),stuck=x=>x.i===idx;
  const N=reached.length,S=reached.filter(stuck).length;if(N<10||!S)return '';
  const nf=z=>{const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const pr=1-d*t*(1.330274*t**4-1.821256*t**3+1.781478*t*t-0.356538*t+0.319381);return z>0?pr:1-pr;};
  const F={'年代':x=>x.r[12],'職業':x=>x.r[13],'コース':x=>x.r[5],'ジャンル':x=>x.r[6]};

// 今後の卒業生に活かすこと：クロス別分析で有意に低かった層と、万垢につながる条件の未達から作る
function futureLessons(c){
  const out=[],D=crossData(c),R=ksfRows(c);
  // 他の卒業月でも同じ層・同じ指標で同じ向きの有意差が出ているか
  const others=(CUR.cohorts||[]).filter(o=>o.ym!==c.ym&&o.phase!=='prep');
  const same=x=>others.filter(o=>crossData(o).L.some(y=>y.k===x.k&&y.m===x.m&&Math.sign(y.diff)===Math.sign(x.diff))).map(o=>mo(o.ym)+'月');
  const tag=ms=>`（${ms.join('・')}卒業でも同じ傾向）`;
  const f60=R.find(x=>/60日/.test(x.lb)),p30=R.find(x=>/30投稿/.test(x.lb));
  if(f60)out.push(`<strong>60日以内のプログラム完了を最優先で追う</strong>：過去の卒業生全体で、満たした人は${f60.rr}倍万垢しやすい（万垢率${f60.rw}%↔${f60.rwo}%）。今月は${f60.cur}%（目安${f60.past}%）。`);
  if(p30)out.push(`<strong>30投稿までのペースをフェーズ2〜3で作る</strong>：過去の卒業生全体で、満たした人は${p30.rr}倍万垢しやすい（万垢率${p30.rw}%↔${p30.rwo}%）。卒業前に追いつくのは難しいため、週${2}本のペースをMGから決める。`);
  D.bad.forEach(x=>{const ms=same(x);if(!ms.length)return;
    if(x.m==='初投稿完了率')out.push(`<strong>${esc(x.k)}の初投稿を早めに支援する</strong>${tag(ms)}：今月は初投稿完了率${x.rate}%（その他より${-x.diff}pt低い）。入会時にこの層をリスト化し、初回HRから30日以内に個別で着手を確認する。`);
    else out.push(`<strong>${esc(x.k)}の伸ばし方を見直す</strong>${tag(ms)}：今月は万垢率${x.rate}%（その他より${-x.diff}pt低い）。フェーズ2のうちに講師が企画を個別に確認する。`);});
  D.good.forEach(x=>{const ms=same(x);if(!ms.length)return;out.push(`<strong>${esc(x.k)}のやり方を横展開する</strong>${tag(ms)}：${x.m}${x.rate}%（その他より+${x.diff}pt）。この層で伸びた生徒の投稿の型を、他の層にも共有する。`);});
  // 絞り込み：万垢につながる条件は1つ（今月未達のものを優先）＋他の月でも共通するボトルネックを影響の大きい順に2つまで
  const ks=[f60,p30].filter(Boolean).sort((a,b)=>(a.ok-b.ok)||(b.rr-a.rr))[0];
  const res=[];
  if(ks)res.push(ks===f60?`<strong>60日以内のプログラム完了を最優先で追う</strong>：満たした人は${ks.rr}倍万垢しやすい。今月は${ks.cur}%（目安${ks.past}%）。`:`<strong>30投稿までのペースをフェーズ2〜3で作る</strong>：満たした人は${ks.rr}倍万垢しやすい。週${2}本のペースをMGから決める。`);
  D.bad.filter(x=>same(x).length).slice(0,2).forEach(x=>{const ms=same(x);
    res.push(x.m==='初投稿完了率'?`<strong>${esc(x.k)}の初投稿を初回HRから30日以内に個別で確認する</strong>${tag(ms)}：初投稿完了率${x.rate}%（その他より${-x.diff}pt低い）。`:`<strong>${esc(x.k)}の企画をフェーズ2のうちに講師が確認する</strong>${tag(ms)}：万垢率${x.rate}%（その他より${-x.diff}pt低い）。`);});
  return res;
}

      // 参考データ

      h+=crossHtml(c);
      h+='</details>';
      if(false){const ap=approach(c),fu=futureLessons(c),L0=c.daysLeft||0;
        if(ap.length)h+=`<h3>${m}月卒業生への対応（残り${L0}日）</h3>${ap.map(x=>`<p>・${x}</p>`).join('')}`;
        if(fu.length)h+=`<h3>今後の卒業生に活かすこと</h3>${fu.map(x=>`<p>・${x}</p>`).join('')}`;}
      const sp=c.speed&&CUR.past&&CUR.past.length?(()=>{const P=CUR.past.filter(x=>x.n>=50);const fa=P.reduce((s,x)=>s+x.fp60,0)/(P.length||1);return c.speed.fp60-fa<=-3})():false;
      if(false){
        h+=`<div class="callout"><span>🔸</span><div><strong>やはり初投稿までの速さが大切</strong><br>初回HRから60日後に投稿したか →この率が高いと、万垢率も高くなる</div></div>
