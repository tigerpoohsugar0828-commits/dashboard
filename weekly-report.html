<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>週次レポート</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1f29;--muted:#6c707b;--line:#e3e6eb;--navy:#223049}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#fff;font-family:'Noto Sans JP','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;letter-spacing:.01em}
a{color:var(--navy)}a:hover{color:#3f6aa8}
.tool{position:sticky;top:0;z-index:10;background:#f7f7f5;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
.btn{border:none;border-radius:6px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.p{background:var(--navy);color:#fff}.btn.s{background:#fff;color:var(--navy);border:1px solid #c9ccd3}
.tool .hint{font-size:12px;color:var(--muted);flex-basis:100%}
.page{max-width:900px;margin:0 auto;padding:40px 48px 120px}
h1{font-size:30px;font-weight:900;margin:0 0 18px;letter-spacing:-.01em}
.props{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.props dt{color:var(--muted)}.props dd{margin:0}
.chip{display:inline-block;background:#e3e2e0;border-radius:4px;padding:0 7px;font-size:13px;white-space:nowrap}
h2{font-size:22px;font-weight:800;margin:40px 0 10px;padding-left:11px;border-left:4px solid var(--navy)}
h3{font-size:17px;font-weight:800;margin:26px 0 6px}
p{margin:3px 0}
.arrow{font-weight:700}
details.coh>summary{cursor:pointer;margin:28px 0 6px;list-style:none}details.coh>summary::-webkit-details-marker{display:none}details.coh>summary::before{content:'▸ ';font-size:22px;color:#6c707b}details.coh[open]>summary::before{content:'▾ '}
.qbig p{font-size:20px;line-height:1.7}.qbig .arrow{font-size:23px;font-weight:900}
.note{color:var(--muted);font-size:14px}
.img{margin:10px 0 6px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.img iframe{width:100%;border:0;display:block;height:200px}
.cp{display:none}
.cp:hover{color:var(--navy)}
table{border-collapse:collapse;font-size:13px;margin:8px 0 14px}
th,td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left}
th{font-size:11px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
td.n{text-align:right;font-feature-settings:'tnum' 1}
table{width:100%}td,th{word-break:keep-all}td.n,th.n{white-space:nowrap}
.box{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0;background:#fafbfc}.box p{margin:3px 0}
.callout{background:#f7f6f3;border-radius:6px;padding:12px 16px;margin:10px 0;display:flex;gap:10px}
textarea{width:100%;min-height:70px;border:1px dashed #cfd3da;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;line-height:1.7;resize:vertical;color:var(--ink)}
textarea:focus{outline:none;border-style:solid;border-color:#9aa0ab}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;display:none;z-index:20}
@media print{.tool,.cp,#toast{display:none!important}.page{padding:0}textarea{border:none;padding:0;min-height:0}h2{break-before:auto}}
</style>
</head>
<body>
<div class="tool">
  <strong style="font-size:14px;">週次レポート</strong>
  <select id="date" onchange="go()"></select>
  <button class="btn p" onclick="exportZip()">Notion用に書き出し（画像込み）</button>
  <button class="btn p" onclick="exportHtmlZip()">Notion用に書き出し（トグル付き・HTML）</button>
  <button class="btn s" onclick="copyText()">文章だけコピー</button>
  <button class="btn s" onclick="window.print()">PDFで出力</button>
  <div class="hint">「Notion用に書き出し」で保存されたZIPを、Notionの「インポート → テキストとMarkdown」で取り込むと、このページが画像込みでそのまま作られます。KPIダッシュボードを開くたびにその日の画面が記録されます（同じブラウザで開いてください）。</div>
</div>
<div class="page" id="page"></div>
<div id="toast"></div>
<script>
const LS='weekly_report_data_v1', WLS=LS, NOTE='weekly_report_note_v3';
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}};
const pc=(a,b)=>b?+(a/b*100).toFixed(1):0;
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mo=ym=>+ym.split('/')[1];
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const PHASE_POSTS={phase2:22,phase3:31,phase4:38,grad:43};
let CUR=null,PREV=null,KEY=null,SHOTS=null,PSHOTS=null,IMGS=[];
function note(id){const a=load(NOTE);return ((a[KEY]||{})[id])||''}
function setNote(id,v){const a=load(NOTE);a[KEY]=a[KEY]||{};a[KEY][id]=v;localStorage.setItem(NOTE,JSON.stringify(a))}
function _idb(){return new Promise((res,rej)=>{const q=indexedDB.open('weekly_report_v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('shots');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function loadShots(key){try{const db=await _idb();return await new Promise(r=>{const q=db.transaction('shots').objectStore('shots').get(key);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});}catch(e){return null;}}
// ── ダッシュボードの画面をそのまま表示 ──
function shot(h,name){
  if(!h)return `<p class="note">（この画面は記録されていません。KPIダッシュボードを開いてから再読み込みしてください）</p>`;
  h=String(h).replace(/<button[^>]*class="gap-btn"[^>]*>[\s\S]*?<\/button>/g,'');
  const i=IMGS.push({name,html:h})-1;
  return `<div class="img"><iframe id="f${i}" title="${esc(name)}"></iframe></div><button class="cp" onclick="copyImg(${i})">↑ 画像としてコピー</button>`;
}
// 表はすべて画像にする（Notionで色・列幅が崩れないように）
function tbl2shot(html){if(!html)return html;return String(html).replace(/<table[\s\S]*?<\/table>/g,t=>(/<a\s[^>]*href=/i.test(t)||/^<table data-keep/.test(t))?t:shot('<div style="padding:8px;background:#fff;">'+t+'</div>'));}
function _noBtn(x){return x?String(x).replace(/<button[^>]*class="gap-btn"[^>]*>[\s\S]*?<\/button>/g,'').replace(/<div[^>]*>\s*▸ ?クリックでボトルネック分析\s*<\/div>/g,''):x;}
function p2Board(c,T1,T9){
  const card=(lb,sub,k,n,t)=>{if(!n)return '';const p=+(k/n*100).toFixed(1),tn=Math.ceil(n*t/100),need=Math.max(0,tn-k),ok=need===0,w=Math.min(100,tn?k/tn*100:0);
    return '<div style="flex:1 1 0;min-width:0;background:#223049;color:#fff;border-radius:16px;padding:22px 24px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;"><div><div style="font-size:18px;font-weight:800;">'+lb+'</div>'+
      '<span style="display:inline-block;margin-top:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;">目標 '+t+'%</span>'+(sub?'<span style="font-size:11.5px;color:#c7cdd8;margin-left:8px;">'+sub+'</span>':'')+'</div>'+
      '<span style="background:'+(ok?'#2f7d5b':'rgba(255,255,255,.14)')+';border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;white-space:nowrap;">'+(ok?'✓ 達成':'✕ 未達成')+'</span></div>'+
      '<div style="display:flex;align-items:flex-end;gap:18px;margin-top:16px;"><div><div style="font-size:52px;font-weight:900;line-height:1;">'+p+'<span style="font-size:22px;">%</span></div><div style="font-size:13px;color:#c7cdd8;margin-top:6px;">'+k+' / '+n+'人</div></div>'+
      '<div style="flex:1;min-width:0;"><div style="font-size:14px;color:#c7cdd8;">'+(ok?'目標 <strong style="color:#f0c34a;font-size:24px;">達成</strong>':'達成まであと <strong style="color:#f0c34a;font-size:28px;">'+need+'人</strong>')+'</div>'+
      '<div style="height:10px;background:rgba(255,255,255,.18);border-radius:999px;margin-top:10px;overflow:hidden;"><div style="height:100%;width:'+w+'%;background:#f0c34a;border-radius:999px;"></div></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:#c7cdd8;margin-top:6px;"><span>'+k+'人 ('+p+'%)</span><span>'+tn+'人 ('+t+'%)</span></div></div></div></div>';};
  const P=c.p90;
  return '<div style="display:flex;gap:14px;padding:4px;background:#fff;font-family:\'Noto Sans JP\',sans-serif;">'+card('フォロワー1000人以上達成率','',c.cur.r1,c.n,T1)+(P&&P.n?card('90日以内の初投稿完了率','初回HRから90日以内',P.k,P.n,T9):'')+'</div>';
}
function frameDoc(h){return `<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet"><style>${(SHOTS&&SHOTS.css)||''}</style><style>html,body{margin:0;padding:0;background:#fff!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body{padding:6px!important}[onclick]{pointer-events:none}#app-sidebar{display:none}.grad-top-grid{grid-template-columns:1fr!important}.grad-top-grid>*:not(:first-child){display:none!important}[data-wr="attr"]{display:none!important}*{font-feature-settings:normal!important;font-variant-numeric:normal!important;font-variant-ligatures:none!important;font-kerning:none!important;letter-spacing:normal!important;text-rendering:optimizeLegibility!important}body{font-family:'Noto Sans JP',sans-serif;color:#1d1f29;font-size:15px;line-height:1.75}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e3e6eb;padding:8px 12px;text-align:left;word-break:normal;overflow-wrap:anywhere;line-break:strict}th{font-size:11px;color:#6c707b;font-weight:700;border-bottom:2px solid #e3e6eb;white-space:nowrap}td.n,th.n{text-align:right;white-space:nowrap}h3{font-size:18px;font-weight:800;margin:10px 0 6px}h4{font-size:15px;font-weight:800;margin:8px 0 4px}.box{border:1px solid #e3e6eb;border-left:4px solid #223049;border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0;background:#fafbfc}.box p{margin:3px 0}.note{font-size:12px;color:#6c707b}</style></head><body>${h}</body></html>`}
function fit(f){try{const d=f.contentDocument;if(!f.offsetParent&&f.closest('details:not([open])'))return;f.style.height='0px';const b=d.body;const hh=Math.max(b.scrollHeight,b.offsetHeight,b.getBoundingClientRect().height);f.style.height=(Math.ceil(hh)+8)+'px'}catch(e){}}
// トグルを開いたときに、中の画像の高さを測り直す（閉じている間は高さ0になるため）
document.addEventListener('toggle',e=>{const d=e.target;if(!d||d.tagName!=='DETAILS'||!d.open)return;d.querySelectorAll('iframe').forEach(f=>{fit(f);setTimeout(()=>fit(f),300);setTimeout(()=>fit(f),1200);});},true);
function mount(){IMGS.forEach((x,i)=>{const f=document.getElementById('f'+i);if(!f)return;f.onload=()=>{fit(f);setTimeout(()=>fit(f),700);setTimeout(()=>fit(f),1800)};f.srcdoc=frameDoc(x.html)})}
function _h2c(){return window.html2canvas?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
// 画像にする：閉じたトグルの中の画面は大きさが0で描けないため、書き出しの間だけ親のトグルを開いて描く
async function toPng(i){await _h2c();const f=document.getElementById('f'+i);if(!f)return null;
  const opened=[];for(let p=f.parentElement;p;p=p.parentElement){if(p.tagName==='DETAILS'&&!p.open){p.open=true;opened.push(p);}}
  try{
    if(opened.length){if(!f.dataset.m&&f.srcdoc==='')f.srcdoc=frameDoc(IMGS[i].html);await new Promise(r=>setTimeout(r,400));fit(f);await new Promise(r=>setTimeout(r,150));}
    try{const fd=f.contentDocument;if(fd&&fd.fonts){await Promise.race([Promise.all(['400','700','800','900'].map(w=>fd.fonts.load(w+' 16px "Noto Sans JP"','あ亜A1'))).then(()=>fd.fonts.ready),new Promise(r=>setTimeout(r,2500))]);}}catch(e){}
    const c=await html2canvas(f.contentDocument.body,{backgroundColor:'#ffffff',scale:2,logging:false,onclone:doc=>{try{const s=doc.createElement('style');s.textContent='*{font-feature-settings:normal!important;font-variant-numeric:normal!important;font-variant-ligatures:none!important;letter-spacing:normal!important;font-kerning:none!important;font-family:"Noto Sans JP",sans-serif!important}';doc.head.appendChild(s);}catch(e){}}});
    if(!c.width||!c.height)return null;
    return await new Promise(r=>c.toBlob(r,'image/png'));
  }finally{opened.forEach(p=>p.open=false);}
}
async function copyImg(i){try{const b=await toPng(i);await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('画像をコピーしました')}catch(e){toast('コピーできませんでした')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
// ── 分析文（良かった点／良くない点）──
function stages(c){return [['fp','初投稿','全員（対象者）'],['r100','100人','初投稿'],['r1','1,000人','100人'],['r3','3,000人','1,000人'],['r5','5,000人','3,000人'],['mk','万垢','5,000人']]}
const BK={fp:'初投稿完了日',r100:'100フォロワー達成日',r1:'1000フォロワー達成日',r3:'3000フォロワー達成日',r5:'5000フォロワー達成日',mk:'万垢達成'};
// ── ① KGI・KPIの進捗 ──
function progressTbl(c){
  const tg=c.targets,N=c.n;const R=[];
  const row=(lb,k,t,isK)=>{if(t==null)return;const cur=c.cur[k],prv=c.prev?c.prev[k]:null,p=pc(cur,N),need=Math.max(0,Math.ceil(N*t/100)-cur),ok=p>=t,d=prv!=null?cur-prv:null;
    R.push(`<tr><td>${isK?'<strong>KGI</strong> ':'KPI '}${lb}</td><td class="n">${t}%</td><td class="n"><strong>${p}%</strong>（${cur}/${N}名）</td><td class="n">${d==null?'—':`<strong style="color:${d>0?'#c0453f':'#6c707b'};">${d>0?'+':''}${d}名</strong>`}</td><td class="n"><strong style="color:${ok?'#c0453f':'#3f6aa8'};">${ok?'達成':'未達'}</strong></td><td class="n">${ok?'—':`あと<strong>${need}</strong>名`}</td></tr>`);};
  const isGrad=c.phase==='grad';
  row(isGrad?'万垢率':'万垢率（今月の目標）','mk',tg.mk,isGrad);
  if(!isGrad&&c.finalKgi!=null&&c.finalKgi!==tg.mk)row('万垢率（卒業時の最終目標）','mk',c.finalKgi,true);
  row('5,000人以上率','r5',tg.r5);row('3,000人以上率','r3',tg.r3);row('1,000人以上率','r1',tg.r1);
  return `<table><thead><tr><th>指標</th><th class="n">目標</th><th class="n">現在</th><th class="n">先週比</th><th class="n">判定</th><th class="n">達成まで</th></tr></thead><tbody>${R.join('')}</tbody></table>`;
}
// ── ロジックツリー（月次資料と同じ構成）：万垢率 ＝ A.投稿の量 × B.フォロワーの伸び ──
function treeData(c){
  const TR=c.treeRef;const bench=TR?{}:(CUR.bench||{});const L=[['fp','初投稿','全員'],['r100','100人','初投稿'],['r1','1,000人','100人'],['r3','3,000人','1,000人'],['r5','5,000人','3,000人'],['mk','万垢','5,000人']];
  let prev=c.n;const R={};L.forEach(([k,lb,pl])=>{const v=prev?+((c.cur[k]||0)/prev*100).toFixed(1):null;const b=bench[BK[k]];const ref=TR?TR[k]:(b?(k==='fp'?b.abs:b.rel):null);R[k]={lb:pl+'→'+lb,v,ref,g:v!=null&&ref!=null?+(v-ref).toFixed(1):null};prev=c.cur[k]||0;});
  const MKP=TR?TR.postMed:null;
  const fa=TR?TR.fp60:null;
  const f60=c.speed&&c.speed.fp60!=null?c.speed.fp60:null;
  return [
    {id:'①',lb:'始めていない',ind:'初投稿完了率',v:R.fp.v,ref:R.fp.ref,g:R.fp.g,br:'A'},
    {id:'②',lb:'始めるのが遅い',ind:'60日以内の初投稿率',v:f60,ref:fa,g:f60!=null&&fa!=null?+(f60-fa).toFixed(1):null,br:'A'},
    {id:'③④',lb:'投稿のペース・量',ind:'投稿数の中央値（本）',v:c.postMed,ref:MKP,g:c.postMed!=null&&MKP!=null?+((c.postMed-MKP)/MKP*100).toFixed(1):null,unit:'本',br:'A',sub:(()=>{const P=c.postDist;const t=TR&&TR.postAvg!=null?TR.postAvg:null;if(c.postAvg==null&&t==null)return '';return `平均 ${c.postAvg!=null?c.postAvg+'本':'—'}（目安 ${t!=null?t+'本':'—'}）`;})()},
    ...(c.phase==='phase2'?[{id:'⑤a',lb:'初投稿→100人',ind:'通過率',v:R.r100.v,ref:R.r100.ref,g:R.r100.g,br:'B'}]:[]),
    {id:c.phase==='phase2'?'⑤b':'⑤',lb:'100人→1,000人',ind:'通過率',v:R.r1.v,ref:R.r1.ref,g:R.r1.g,br:'B'},
    {id:'⑥a',lb:'1,000人→3,000人',ind:'通過率',v:R.r3.v,ref:R.r3.ref,g:R.r3.g,br:'B'},
    {id:'⑥b',lb:'3,000人→5,000人',ind:'通過率',v:R.r5.v,ref:R.r5.ref,g:R.r5.g,br:'B'},
    {id:'⑦',lb:'伸ばし切り',ind:'5,000人→万垢の通過率',v:R.mk.v,ref:R.mk.ref,g:R.mk.g,br:'B'}
  ].filter(x=>c.phase!=='phase2'||!['⑥a','⑥b','⑦'].includes(x.id)).map(x=>{if(x.g==null&&x.v!=null&&x.ref!=null)x.g=+(x.v-x.ref).toFixed(1);x.st=x.g==null?['—','#9aa0ab']:(x.g<=-3?['低い','#3f6aa8']:(x.g<0?['やや低い','#7f9cc8']:(x.g>=3?['高い','#c0453f']:['問題なし','#6c707b'])));return x;});
}
function treeHtml(c,m){
  const T=treeData(c);const bx=x=>`<div style="border:2px solid ${x.st[1]};border-radius:10px;padding:8px 10px;background:${x.st[0]==='低い'?'#eef3fb':(x.st[0]==='高い'?'#fdecec':'#fff')};min-width:0;">
    <div style="font-size:12px;font-weight:800;">${x.id} ${x.lb}</div><div style="font-size:10.5px;color:#6c707b;">${x.ind}</div>
    <div style="font-size:18px;font-weight:900;color:${x.st[1]};">${x.v==null?'—':x.v+(x.unit||'%')}</div>
    <div style="font-size:10.5px;color:#6c707b;">目安 ${x.ref==null?'—':x.ref+(x.unit||'%')}</div>${x.sub?`<div style="font-size:10.5px;color:#6c707b;">${x.sub}</div>`:''}

      L.push('### ② プログラムで止まっている生徒','');_md(()=>stepTierPlan(c,m).replace(/<h3>[^<]*<\/h3>/,''));
      L.push('','**その他データ（プログラム別・STEP別の生徒分類）**','');
      _md(()=>progBreak(c).html);
      _md(()=>stepTierHtml(c,m));}
    else if(c.phase==='phase2'){_md(()=>phase2Html(c,m,S));if(note('c_'+c.ym))L.push(note('c_'+c.ym),'');}
    else{const tg=c.targets;
      const _goalH=`<div style="background:#fdecec;border-radius:8px;padding:10px 14px;margin:4px 0 10px;">${[['mk','万垢率'],['r5','5000人以上率'],['r3','3000人以上率'],['r1','1000人以上率']].filter(([k])=>tg[k]!=null).map(([k,lb])=>`<p style="margin:2px 0;">${lb}：<strong>${tg[k]}%</strong></p>`).join('')}</div>`;
      pushShot(`<div style="padding:8px;background:#fff;">${_goalH}<h3 style="margin:10px 0 6px;">① KGI・KPIの現状と予測</h3>${progressTbl(c)}</div>`,m+'月卒業生_目標と現状');
      pushShot(S.kgi,m+'月卒業生_万垢率');if(c.phase==='grad')pushShot(S.bands,m+'月卒業生_フォロワー帯');else pushShot(S.kpi2,m+'月卒業生_KPI②');
      if(S.landing){L.push('**着地見込み（予測）**');pushShot(_noDiag(S.landing),m+'月卒業生_着地見込み');}
      if(c.phase!=='grad'){L.push('### ロジックツリー（どこがボトルネックか）','');pushShot(`<div style="padding:8px;background:#fff;">${treeHtml(c,m)}</div>`,m+'月卒業生_ロジックツリー');}
      if(c.phase!=='grad'){L.push('#### ボトルネック分析','');_md(()=>bnAnalysis(c,m));L.push('### ② ボトルネックに共通する特徴','');_md(()=>bnFeatureHtml(c,m).h);L.push('### ③ 打ち手の提案','');_md(()=>bnFeatureHtml(c,m).p);}
      else{L.push('### ② 個別アプローチ（万垢に届きうる生徒）','');_md(()=>focusPlan(c,m));}
      if(note('c_'+c.ym))L.push(note('c_'+c.ym),'');}
  });
  L.push('','## 報告','',note('report')||'');
  return L.join('\n');
}
async function copyText(){if(!CUR)return;try{await navigator.clipboard.writeText(toMd(false));toast('文章をコピーしました。Notionに貼り付けてください')}catch(e){toast('コピーできませんでした')}}
function _jszip(){return window.JSZip?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportZip(){
  if(!CUR)return;toast('書き出し中…（画像を作成しています）');
  try{
    await _jszip();const zip=new JSZip();const dir=zip.folder('images');
    const fails=[];for(let i=0;i<IMGS.length;i++){const b=await toPng(i);if(b)dir.file(String(i+1).padStart(2,'0')+'.png',b);else fails.push(i+1);}
    if(fails.length)console.warn('[Notion書き出し] 画像を作れなかった番号',fails);
    const at=new Date(CUR.at),title=`${String(at.getFullYear()).slice(2)}年${at.getMonth()+1}月${Math.ceil(at.getDate()/7)}週目_週次会議`;
    let md=domToMd();
    fails.forEach(n=>{const nm=String(n).padStart(2,'0')+'.png';const re=new RegExp('!\\[[^\\]]*\\]\\(images/'+nm+'\\)','g');let alt='';try{alt=h2md(IMGS[n-1].html).join('\n');}catch(e){}md=md.replace(re,alt||'');});
    zip.file(title+'.md',md);
    const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title+'.zip';a.click();
    toast('ZIPを保存しました。Notionの「インポート」から取り込んでください');
  }catch(e){toast('書き出しに失敗しました：'+e.message)}
}


function domToMd(){
  const page=document.getElementById('page');
  page.querySelectorAll('details[ontoggle]').forEach(d=>{if(!d.dataset.f){try{d.dataset.f=1;const tb=d.querySelector('.tb');const m=(d.getAttribute('ontoggle')||'').match(/_tierRows\['([^']+)'\]/);if(tb&&m&&window._tierRows[m[1]])tb.innerHTML=window._tierRows[m[1]]();}catch(e){}}});
  const cl=page.cloneNode(true);
  cl.querySelectorAll('.img').forEach(d=>{const f=d.querySelector('iframe');const i=f?+String(f.id).slice(1):-1;const p=document.createElement('p');p.textContent=i>=0?'@@IMG:'+i+'@@':'';d.replaceWith(p);});
  cl.querySelectorAll('button,textarea,script,.cp').forEach(e=>e.remove());
  cl.querySelectorAll('details.coh').forEach(d=>{const s=d.querySelector(':scope>summary');const h2=document.createElement('h2');h2.textContent=s?s.textContent.trim():'';if(s)s.remove();d.before(h2);while(d.firstChild)d.before(d.firstChild);d.remove();});
  return h2md(cl.innerHTML).map(l=>{const m=typeof l==='string'&&l.trim().match(/^@@IMG:(\d+)@@$/);return m?'\n![](images/'+String(+m[1]+1).padStart(2,'0')+'.png)\n':l;}).join('\n').replace(/\n{3,}/g,'\n\n');
}
// Notion用：画面をそのままHTMLにする（トグル＝<details>、画像＝PNG）。Notionの「インポート → HTML」で取り込むとトグルが残る
async function exportHtmlZip(){
  if(!CUR)return;toast('書き出し中…（画像を作成しています）');
  try{await _jszip();const zip=new JSZip();const page=document.getElementById('page');
    // 開くまで中身を作らないトグルを先に作る
    page.querySelectorAll('details[ontoggle]').forEach(d=>{if(!d.dataset.f){try{d.dataset.f=1;const tb=d.querySelector('.tb');const m=(d.getAttribute('ontoggle')||'').match(/_tierRows\['([^']+)'\]/);if(tb&&m&&window._tierRows[m[1]])tb.innerHTML=window._tierRows[m[1]]();}catch(e){}}});
    const at=new Date(CUR.at),title=String(at.getFullYear()).slice(2)+'年'+(at.getMonth()+1)+'月'+Math.ceil(at.getDate()/7)+'週目_週次会議';
    const names={};for(let i=0;i<IMGS.length;i++){const b=await toPng(i);if(b){const fn='images/'+String(i+1).padStart(3,'0')+'.png';zip.file(fn,b);names[i]=fn;}}
    const cl=page.cloneNode(true);
    cl.querySelectorAll('.img').forEach(d=>{const f=d.querySelector('iframe');const i=f?+String(f.id).slice(1):-1;if(names[i]){const im=document.createElement('img');im.src=names[i];im.alt='';d.replaceWith(im);}else d.remove();});
    cl.querySelectorAll('button,textarea,script,.cp').forEach(e=>e.remove());
    cl.querySelectorAll('details').forEach(d=>d.removeAttribute('ontoggle'));
    cl.querySelectorAll('summary h2').forEach(x=>{const s=document.createElement('strong');s.textContent=x.textContent;x.replaceWith(s);});
    const html='<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>'+title+'</title></head><body><article>'+cl.innerHTML+'</article></body></html>';
    zip.file(title+'.html',html);
    const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title+'_HTML.zip';a.click();
    toast('ZIPを保存しました。Notionの「インポート → HTML」で取り込んでください');
  }catch(e){toast('書き出しに失敗しました：'+e.message)}
}
